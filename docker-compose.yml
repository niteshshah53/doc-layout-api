# docker-compose.yml
# Usage:
#   docker compose up --build          # build and start
#   docker compose up -d               # run in background
#   docker compose logs -f api         # follow logs
#   docker compose down                # stop and remove containers

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: doc-layout-api:latest
    container_name: doc-layout-api

    ports:
      - "8000:8000"

    environment:
      - DEVICE=cpu
      - MAX_FILE_SIZE_MB=10
      - DEBUG=false

    # ── Health & restart ─────────────────────────────────────────────────
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
